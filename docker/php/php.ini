[PHP]
; Ukuran upload dan post yang cukup untuk berkas bank soal word, audio listening, dan foto siswa
memory_limit = 512M
upload_max_filesize = 128M
post_max_size = 128M
max_execution_time = 300
max_input_time = 300
max_input_vars = 5000

; Zona Waktu Indonesia Barat (Sesuaikan ke Asia/Makassar atau Asia/Jayapura jika diperlukan)
date.timezone = Asia/Jakarta

; Keamanan & Logging
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT

; Optimasi Opcache untuk performa tinggi saat ujian serentak
[opcache]
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1
